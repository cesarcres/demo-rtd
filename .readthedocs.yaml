# Configuració de Read the Docs (obligatòria des de setembre de 2023)
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

# Sphinx llegeix la configuració de docs/conf.py
sphinx:
  configuration: docs/conf.py

# Formats extra a més de l'HTML
formats:
  - pdf
  - epub

python:
  install:
    - requirements: docs/requirements.txt
